<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="오늘">
<title>오늘</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231E6B52'/%3E%3Ccircle cx='32' cy='32' r='11' fill='white'/%3E%3C/svg%3E">
<style>
:root{
  --accent:#1E6B52;
  --accent-12:rgba(30,107,82,.12);
  --accent-30:rgba(30,107,82,.32);
  --accent-60:rgba(30,107,82,.62);
  --ink:#16181A;
  --g1:#5E6266;
  --g2:#9A9EA2;
  --g3:#D9DCDE;
  --g4:#EEF0F1;
  --g5:#F6F7F7;
  --r:18px;
  --pad:20px;
  --font:"Pretendard Variable","Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#fff;color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;letter-spacing:-.01em}
body{min-height:100dvh;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit;border:0;outline:0;background:none;resize:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}

/* ---------- layout ---------- */
.app{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) var(--pad) calc(env(safe-area-inset-bottom) + 18px);display:flex;flex-direction:column;gap:14px;min-height:100dvh}
@media (min-width:860px){
  .app{max-width:920px;display:grid;grid-template-columns:1fr 1fr;column-gap:56px;row-gap:18px;align-content:start;padding-top:48px}
  .top,.band{grid-column:1/-1}
  .colA{grid-column:1;grid-row:3/span 3;display:flex;flex-direction:column;gap:18px}
  .domains{grid-column:2;grid-row:3}
}
.colA{display:contents}
.top,.band{order:0}.one{order:1}.domains{order:2}.trio{order:3}.jbtn{order:4}
@media (min-width:860px){.colA{display:flex}}

/* ---------- top ---------- */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.date-sm{font-size:13px;color:var(--g2);letter-spacing:.06em;font-weight:500}
.date{white-space:nowrap;font-size:26px;font-weight:700;letter-spacing:-.035em;line-height:1.15;margin-top:2px}
.date .dow{color:var(--g2);font-weight:500;margin-left:6px;font-size:20px}
.pulse{display:flex;align-items:flex-end;gap:10px}
.weave{display:flex;align-items:flex-end;gap:3px;height:30px}
.weave i{display:block;width:5px;border-radius:3px;background:var(--g3);transition:height .35s cubic-bezier(.3,1.4,.5,1),background .2s}
.weave i.on{background:var(--accent)}
.total{text-align:right;line-height:1.1}
.total b{font-size:20px;font-weight:700;letter-spacing:-.03em}
.total b small{font-size:13px;color:var(--g2);font-weight:500}
.delta{display:block;font-size:12px;max-width:96px;overflow:hidden;text-overflow:ellipsis;color:var(--g2);margin-top:3px;white-space:nowrap}
.delta.up{color:var(--accent)}
.gear{width:36px;height:36px;display:grid;place-items:center;border-radius:12px;color:var(--g2);margin-left:2px;margin-bottom:-4px}
.gear:active{background:var(--g5)}

/* ---------- backup band ---------- */
.band{display:none;align-items:center;gap:10px;padding:9px 10px 9px 14px;border-radius:14px;background:var(--g5);font-size:14px;color:var(--g1)}
.band.show{display:flex}
.band span{flex:1}
.band .b-act{font-size:14px;font-weight:600;color:var(--accent);padding:4px 8px}
.band .b-x{color:var(--g2);padding:4px 6px;font-size:16px}

/* ---------- one thing ---------- */
.one{position:relative;border-radius:22px;background:var(--accent);color:#fff;padding:16px 18px 18px;cursor:text;overflow:hidden;min-height:104px}
.one::after{content:"";position:absolute;right:-38px;top:-38px;width:120px;height:120px;border-radius:50%;border:1.5px solid rgba(255,255,255,.18)}
.one::before{content:"";position:absolute;right:-8px;top:-8px;width:60px;height:60px;border-radius:50%;border:1.5px solid rgba(255,255,255,.14)}
.one label{display:block;font-size:13px;font-weight:600;letter-spacing:.04em;opacity:.72}
.one textarea{display:block;width:100%;margin-top:6px;font-size:22px;font-weight:650;line-height:1.35;letter-spacing:-.03em;color:#fff;min-height:30px;overflow:hidden}
.one textarea::placeholder{color:rgba(255,255,255,.55);font-weight:500}
.one.empty{background:var(--g5);color:var(--ink)}
.one.empty::after,.one.empty::before{border-color:var(--g3)}
.one.empty textarea{color:var(--ink)}
.one.empty textarea::placeholder{color:var(--g2)}
.one.empty label{opacity:1;color:var(--g2)}

/* ---------- domains ---------- */
.domains{display:flex;flex-direction:column}
.dhead{display:flex;justify-content:space-between;align-items:baseline;padding:0 2px 4px}
.dhead h2{font-size:13px;font-weight:600;color:var(--g2);letter-spacing:.04em}
.legend{font-size:12px;color:var(--g2)}
.row{display:flex;align-items:center;gap:10px;min-height:46px;border-bottom:1px solid var(--g4);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.row:last-child{border-bottom:0}
.row .lab{flex:1;min-width:0;padding:4px 0}
.row .name{font-size:16px;font-weight:550;letter-spacing:-.02em;display:flex;align-items:center;gap:0}
.row .name .grp{color:var(--g2);font-weight:450}
.row .memo{display:block;font-size:13px;color:var(--g2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:-1px}
.row.pressing{background:linear-gradient(90deg,var(--g5),transparent)}
.seg{display:flex;gap:5px}
.seg button{width:42px;height:36px;border-radius:11px;background:var(--g5);color:var(--g2);font-size:15px;font-weight:600;transition:background .18s,color .18s,transform .12s}
.seg button:active{transform:scale(.9)}
.seg button[aria-pressed="true"][data-s="0"]{background:var(--g3);color:var(--ink)}
.seg button[aria-pressed="true"][data-s="1"]{background:var(--accent-30);color:var(--accent)}
.seg button[aria-pressed="true"][data-s="2"]{background:var(--accent-60);color:#fff}
.seg button[aria-pressed="true"][data-s="3"]{background:var(--accent);color:#fff}
.seg button.pop{animation:pop .32s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.82)}100%{transform:scale(1)}}

/* ---------- three cells ---------- */
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cell{border-radius:16px;background:var(--g5);padding:11px 12px 12px;text-align:left;min-height:78px;display:flex;flex-direction:column;gap:3px;transition:transform .12s}
.cell:active{transform:scale(.97)}
.cell .t{font-size:13px;font-weight:600;color:var(--g1);display:flex;justify-content:space-between;align-items:center}
.cell .t em{font-style:normal;font-size:12px;font-weight:700;color:#fff;background:var(--accent);border-radius:9px;min-width:18px;height:18px;line-height:18px;text-align:center;padding:0 5px}
.cell .p{font-size:14px;line-height:1.35;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all}
.cell .p.ph{color:var(--g2)}

/* ---------- journal button ---------- */
.jbtn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:15px 18px;border-radius:16px;border:1.5px solid var(--g4);font-size:16px;font-weight:600;transition:border-color .2s}
.jbtn:active{border-color:var(--accent)}
.jbtn small{font-size:13px;color:var(--g2);font-weight:500}
.jbtn svg{color:var(--accent)}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(22,24,26,.28);opacity:0;pointer-events:none;transition:opacity .22s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;background:#fff;border-radius:24px 24px 0 0;padding:10px var(--pad) calc(env(safe-area-inset-bottom) + 20px);transform:translateY(calc(100% + 40px));visibility:hidden;transition:transform .3s cubic-bezier(.2,.9,.3,1),visibility 0s .3s;z-index:21;max-height:86dvh;overflow:auto}
.sheet.on{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.2,.9,.3,1),visibility 0s}
.grab{width:36px;height:4px;border-radius:2px;background:var(--g3);margin:0 auto 14px}
.sheet h3{font-size:20px;font-weight:700;letter-spacing:-.03em}
.sheet .sub{font-size:14px;color:var(--g2);margin-top:2px}
.lines{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.line{display:flex;align-items:center;gap:10px;background:var(--g5);border-radius:14px;padding:0 6px 0 14px}
.line i{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
.line input{flex:1;padding:13px 0;font-size:16px;min-width:0}
.line input::placeholder{color:var(--g2)}
.line .del{color:var(--g2);width:34px;height:34px;font-size:18px}
.more{margin-top:10px;font-size:15px;font-weight:600;color:var(--accent);padding:8px 2px}
.done{display:block;width:100%;margin-top:16px;padding:14px;border-radius:14px;background:var(--ink);color:#fff;font-weight:600;font-size:16px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--g4)}
.setrow:last-of-type{border-bottom:0}
.setrow .k{font-weight:600}
.setrow .v{font-size:13px;color:var(--g2);margin-top:1px}
.pill{padding:9px 14px;border-radius:12px;background:var(--g5);font-weight:600;font-size:15px;white-space:nowrap}
.pill.acc{background:var(--accent);color:#fff}
.fine{font-size:13px;color:var(--g2);margin-top:14px;line-height:1.55}

/* ---------- journal ---------- */
.journal{position:fixed;inset:0;background:#fff;z-index:30;display:flex;flex-direction:column;transform:translateY(24px);opacity:0;pointer-events:none;transition:opacity .22s,transform .28s cubic-bezier(.2,.9,.3,1)}
.journal.on{opacity:1;transform:none;pointer-events:auto}
.jbar{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 10px) 12px 6px 6px;max-width:720px;width:100%;margin:0 auto}
.back{display:flex;align-items:center;gap:4px;padding:8px 10px;font-weight:600;color:var(--g1);border-radius:12px}
.jmeta{font-size:13px;color:var(--g2);text-align:right;line-height:1.3}
.jmeta b{color:var(--ink);font-weight:600}
.saved{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--g3);margin-right:5px;vertical-align:1px;transition:background .3s}
.saved.ok{background:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px var(--pad) 10px;max-width:720px;width:100%;margin:0 auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;border:1.5px solid var(--g4);font-size:14px;color:var(--g1);white-space:nowrap;transition:border-color .15s,color .15s}
.chip:active{border-color:var(--accent);color:var(--accent)}
.jarea{flex:1;width:100%;max-width:720px;margin:0 auto;padding:10px var(--pad) calc(env(safe-area-inset-bottom) + 40px);font-size:18px;line-height:1.8;letter-spacing:-.01em;overflow:auto}
.jarea::placeholder{color:var(--g3)}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translate(-50%,20px);background:var(--ink);color:#fff;font-size:14px;padding:10px 16px;border-radius:12px;opacity:0;transition:.25s;z-index:40;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-height:700px){
  .row{min-height:42px}.seg button{height:33px}
  .one{min-height:92px;padding:13px 16px 15px}.one textarea{font-size:20px}
  .cell{min-height:70px}.jbtn{padding:13px 16px}.app{gap:11px}
}
@media (max-width:380px){.weave{display:none}.date{font-size:24px}.date .dow{font-size:18px}.seg button{width:38px}.seg{gap:4px}:root{--pad:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="app" id="app">
  <header class="top">
    <div>
      <div class="date-sm num" id="dateSm"></div>
      <h1 class="date" id="date"></h1>
    </div>
    <div class="pulse">
      <div class="weave" id="weave" aria-hidden="true"></div>
      <div class="total num"><b id="total">0<small>/24</small></b><span class="delta" id="delta"></span></div>
      <button class="gear" id="gear" aria-label="설정">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>

  <div class="band" id="band" role="status">
    <span id="bandText">백업한 지 7일 됐어요</span>
    <button class="b-act" id="bandExport">내보내기</button>
    <button class="b-x" id="bandX" aria-label="오늘은 숨기기">×</button>
  </div>

  <div class="colA">
    <section class="one empty" id="one">
      <label for="oneInput">오늘의 하나</label>
      <textarea id="oneInput" rows="1" placeholder="뭐 하나만 한다면?" enterkeyhint="done"></textarea>
    </section>
    <section class="trio" id="trio"></section>
    <button class="jbtn" id="jOpen">
      <span>주저리 쓰기 <small id="jCount"></small></span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
    </button>
  </div>

  <section class="domains" id="domains" aria-label="영역별 점수">
    <div class="dhead"><h2>여덟 갈래</h2><span class="legend">0 못함 · 1 인지 · 2 조금 · 3 제대로</span></div>
    <div id="rows"></div>
  </section>
</main>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div>

<section class="journal" id="journal" aria-label="주저리">
  <div class="jbar">
    <button class="back" id="jBack"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>오늘</button>
    <div class="jmeta num"><div id="jDate"></div><div><span class="saved" id="jSaved"></span><b id="jLen">0</b>자</div></div>
  </div>
  <div class="chips" id="chips"></div>
  <textarea class="jarea" id="jArea" placeholder="아무거나, 생각나는 대로."></textarea>
</section>

<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
"use strict";
/* ================= DB ================= */
const db = new Dexie("oneul");
db.version(1).stores({
  checkins:   "[date+domain], date, domain",
  dailyLogs:  "date",
  journals:   "date",
  goals:      "++id, status, deadline",
  milestones: "++id, goalId, order",
  tasks:      "++id, milestoneId, status",
  goalTouches:"++id, date, goalId",
  meta:       "key"
});
const TABLES = ["checkins","dailyLogs","journals","goals","milestones","tasks","goalTouches","meta"];

const DOMAINS = ["건강","몸상태","영적","공부","관계-회사","관계-가족","업무","취미"];
const SCORE_WORD = ["못함","인지만","조금","제대로"];
const TRIO = [
  {key:"gratitude", label:"감사한 일", ph:"고마웠던 것 하나"},
  {key:"wins",      label:"잘한 것",   ph:"작아도 괜찮아요"},
  {key:"discard",   label:"버릴 것",   ph:"내려놓을 것"}
];
const CHIPS = ["오늘 제일 걸렸던 건…","몸은 어땠나…","내일의 나에게…"];
const DOW = ["일","월","화","수","목","금","토"];

const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,"0");
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayKey = () => keyOf(new Date());
const shiftKey = (k, n) => { const [y,m,d] = k.split("-").map(Number); return keyOf(new Date(y, m-1, d+n)); };
const debounce = (fn, ms) => { let t; const f = (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; f.flush = (...a) => { clearTimeout(t); fn(...a); }; return f; };
const buzz = () => { try { navigator.vibrate && navigator.vibrate(8); } catch(e){} };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ================= state ================= */
let day = todayKey();
let scores = {};   // domain -> {score, note}
let log = emptyLog(day);
let yTotal = null;
let persisted = null;
function emptyLog(date){ return {date, oneThing:"", gratitude:[], wins:[], discard:[]}; }

async function getMeta(k){ const r = await db.meta.get(k); return r ? r.value : undefined; }
const setMeta = (k, v) => db.meta.put({key:k, value:v});

/* ================= load ================= */
async function loadDay(){
  day = todayKey();
  scores = {};
  (await db.checkins.where("date").equals(day).toArray()).forEach(c => scores[c.domain] = {score:c.score, note:c.note||""});
  log = Object.assign(emptyLog(day), await db.dailyLogs.get(day) || {});
  const y = await db.checkins.where("date").equals(shiftKey(day,-1)).toArray();
  yTotal = y.filter(c => typeof c.score === "number").length ? y.reduce((a,c) => a + (c.score||0), 0) : null;
  renderAll();
}

/* ================= render ================= */
function renderAll(){ renderDate(); renderOne(); renderRows(); renderPulse(); renderTrio(); renderJCount(); }

function renderDate(){
  const [y,m,d] = day.split("-").map(Number);
  const dt = new Date(y, m-1, d);
  $("#dateSm").textContent = `${y} · ${pad(m)}`;
  $("#date").innerHTML = `${m}월 ${d}일<span class="dow">${DOW[dt.getDay()]}요일</span>`;
}

function renderPulse(){
  const w = $("#weave");
  if (!w.children.length) DOMAINS.forEach(() => w.appendChild(document.createElement("i")));
  let total = 0;
  DOMAINS.forEach((dm, i) => {
    const s = scores[dm] && typeof scores[dm].score === "number" ? scores[dm].score : null;
    if (s !== null) total += s;
    const bar = w.children[i];
    bar.style.height = (s === null ? 4 : 6 + s * 8) + "px";
    bar.classList.toggle("on", s !== null && s > 0);
  });
  $("#total").innerHTML = `${total}<small>/24</small>`;
  const de = $("#delta");
  if (yTotal === null){ de.textContent = "어제 기록 없음"; de.className = "delta"; }
  else {
    const diff = total - yTotal;
    de.textContent = diff === 0 ? "어제와 같음" : `어제보다 ${diff > 0 ? "+" : "−"}${Math.abs(diff)}`;
    de.className = "delta" + (diff > 0 ? " up" : "");
  }
}

function renderRows(){
  const wrap = $("#rows");
  wrap.innerHTML = DOMAINS.map(dm => {
    const c = scores[dm] || {};
    const parts = dm.split("-");
    const name = parts.length > 1 ? `<span class="grp">${parts[0]}&thinsp;·&thinsp;</span>${parts[1]}` : dm;
    return `<div class="row" data-d="${dm}">
      <div class="lab"><span class="name">${name}</span>${c.note ? `<span class="memo">${esc(c.note)}</span>` : ""}</div>
      <div class="seg" role="group" aria-label="${dm}">${[0,1,2,3].map(s =>
        `<button data-s="${s}" aria-pressed="${c.score === s}" aria-label="${dm} ${s}점 ${SCORE_WORD[s]}">${s}</button>`).join("")}</div>
    </div>`;
  }).join("");
}

function renderOne(){
  const ta = $("#oneInput");
  if (document.activeElement !== ta) ta.value = log.oneThing || "";
  $("#one").classList.toggle("empty", !(log.oneThing||"").trim() && document.activeElement !== ta);
  autosize(ta);
}
function autosize(ta){ ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px"; }

function renderTrio(){
  $("#trio").innerHTML = TRIO.map(t => {
    const items = (log[t.key] || []).filter(Boolean);
    return `<button class="cell" data-k="${t.key}">
      <span class="t">${t.label}${items.length > 1 ? `<em>${items.length}</em>` : ""}</span>
      <span class="p ${items.length ? "" : "ph"}">${items.length ? esc(items[0]) : "+ 적기"}</span>
    </button>`;
  }).join("");
}

async function renderJCount(){
  const j = await db.journals.get(day);
  const n = j && j.body ? [...j.body].length : 0;
  $("#jOpen span").innerHTML = n ? `주저리 이어 쓰기 <small class="num">· ${n.toLocaleString()}자</small>` : `주저리 쓰기`;
}

/* ================= save ================= */
async function saveScore(dm, score){
  const prev = scores[dm] || {};
  const note = prev.note || "";
  if (score === null && !note){ delete scores[dm]; await db.checkins.delete([day, dm]); }
  else { scores[dm] = {score, note}; await db.checkins.put({date:day, domain:dm, score, note}); }
}
async function saveNote(dm, note){
  const prev = scores[dm] || {score:null};
  if (prev.score === null && !note){ delete scores[dm]; await db.checkins.delete([day, dm]); }
  else { scores[dm] = {score:prev.score, note}; await db.checkins.put({date:day, domain:dm, score:prev.score, note}); }
}
const saveLog = debounce(() => db.dailyLogs.put({
  date: log.date, oneThing: log.oneThing || "",
  gratitude: (log.gratitude||[]).map(s=>s.trim()).filter(Boolean),
  wins: (log.wins||[]).map(s=>s.trim()).filter(Boolean),
  discard: (log.discard||[]).map(s=>s.trim()).filter(Boolean)
}), 300);

/* ================= interactions: scores ================= */
let lpTimer = null, lpFired = false, lpStart = null;
const rowsEl = $("#rows");
rowsEl.addEventListener("pointerdown", e => {
  const row = e.target.closest(".row"); if (!row) return;
  lpFired = false; lpStart = {x:e.clientX, y:e.clientY};
  clearTimeout(lpTimer);
  row.classList.add("pressing");
  lpTimer = setTimeout(() => { lpFired = true; row.classList.remove("pressing"); buzz(); openNote(row.dataset.d); }, 480);
});
const lpCancel = () => { clearTimeout(lpTimer); rowsEl.querySelectorAll(".pressing").forEach(r => r.classList.remove("pressing")); };
rowsEl.addEventListener("pointermove", e => { if (lpStart && Math.hypot(e.clientX-lpStart.x, e.clientY-lpStart.y) > 10) lpCancel(); });
["pointerup","pointercancel","pointerleave"].forEach(ev => rowsEl.addEventListener(ev, lpCancel));
rowsEl.addEventListener("contextmenu", e => e.preventDefault());
rowsEl.addEventListener("click", async e => {
  if (lpFired){ lpFired = false; return; }
  const b = e.target.closest(".seg button"); if (!b) return;
  const dm = b.closest(".row").dataset.d, s = Number(b.dataset.s);
  const cur = scores[dm] && scores[dm].score;
  const next = cur === s ? null : s;  // 같은 점수 다시 누르면 지움
  b.closest(".seg").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(Number(x.dataset.s) === next)));
  if (next !== null){ b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop"); }
  buzz();
  await saveScore(dm, next);
  renderPulse();
});

/* ================= one thing ================= */
const oneTa = $("#oneInput");
$("#one").addEventListener("click", () => oneTa.focus());
oneTa.addEventListener("focus", () => $("#one").classList.remove("empty"));
oneTa.addEventListener("blur", () => { saveLog.flush(); renderOne(); });
oneTa.addEventListener("input", () => { log.oneThing = oneTa.value.replace(/\n/g," "); autosize(oneTa); saveLog(); });
oneTa.addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing){ e.preventDefault(); oneTa.blur(); } });

/* ================= sheet ================= */
let sheetClose = null;
function openSheet(html, onOpen, onClose){
  $("#sheetBody").innerHTML = html;
  $("#scrim").classList.add("on"); $("#sheet").classList.add("on");
  sheetClose = onClose || null;
  history.pushState({ui:"sheet"}, "");
  onOpen && onOpen($("#sheetBody"));
}
function closeSheet(fromPop){
  if (!$("#sheet").classList.contains("on")) return;
  document.activeElement && document.activeElement.blur();
  $("#scrim").classList.remove("on"); $("#sheet").classList.remove("on");
  const fn = sheetClose; sheetClose = null; fn && fn();
  if (!fromPop && history.state && history.state.ui === "sheet") history.back();
}
$("#scrim").addEventListener("click", () => closeSheet());

function openNote(dm){
  const c = scores[dm] || {};
  openSheet(`<h3>${dm.replace("-","·")}</h3><p class="sub">한 줄 메모${typeof c.score==="number" ? ` · 오늘 ${c.score}점 ${SCORE_WORD[c.score]}` : ""}</p>
    <div class="lines"><div class="line"><i></i><input id="noteIn" maxlength="120" placeholder="짧게 한 줄" enterkeyhint="done" value="${esc(c.note||"")}"></div></div>
    <button class="done" id="noteDone">닫기</button>`,
    el => {
      const inp = el.querySelector("#noteIn");
      const save = debounce(() => saveNote(dm, inp.value.trim()), 250);
      inp.addEventListener("input", save);
      inp.addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing){ e.preventDefault(); closeSheet(); } });
      el.querySelector("#noteDone").onclick = () => closeSheet();
      sheetClose = () => { save.flush(); setTimeout(renderRows, 30); };
      setTimeout(() => inp.focus(), 280);
    });
}

function openTrio(key){
  const t = TRIO.find(x => x.key === key);
  if (!log[key] || !log[key].length) log[key] = [""];
  const lineHtml = (v, i) => `<div class="line"><i></i><input data-i="${i}" maxlength="200" placeholder="${t.ph}" enterkeyhint="next" value="${esc(v)}"><button class="del" data-i="${i}" aria-label="지우기">×</button></div>`;
  openSheet(`<h3>${t.label}</h3><div class="lines" id="lines">${log[key].map(lineHtml).join("")}</div>
    <button class="more" id="more">+ 더</button><button class="done" id="trioDone">닫기</button>`,
    el => {
      const lines = el.querySelector("#lines");
      const redraw = focusLast => {
        lines.innerHTML = log[key].map(lineHtml).join("");
        if (focusLast){ const ins = lines.querySelectorAll("input"); ins[ins.length-1].focus(); }
      };
      const add = () => { log[key].push(""); redraw(true); };
      lines.addEventListener("input", e => { if (e.target.matches("input")){ log[key][+e.target.dataset.i] = e.target.value; saveLog(); } });
      lines.addEventListener("keydown", e => {
        if (e.key === "Enter" && !e.isComposing && e.target.matches("input")){
          e.preventDefault();
          if (e.target.value.trim()) add(); else closeSheet();
        }
      });
      lines.addEventListener("click", e => {
        const d = e.target.closest(".del"); if (!d) return;
        log[key].splice(+d.dataset.i, 1); if (!log[key].length) log[key] = [""];
        saveLog(); redraw(false);
      });
      el.querySelector("#more").onclick = add;
      el.querySelector("#trioDone").onclick = () => closeSheet();
      sheetClose = () => { log[key] = log[key].map(s => s.trim()).filter(Boolean); saveLog.flush(); renderTrio(); };
      setTimeout(() => { const ins = lines.querySelectorAll("input"); const empty = [...ins].find(i => !i.value); (empty || ins[ins.length-1]).focus(); }, 280);
    });
}
$("#trio").addEventListener("click", e => { const c = e.target.closest(".cell"); if (c) openTrio(c.dataset.k); });

/* ================= journal ================= */
let jDay = day;
const jArea = $("#jArea");
const saveJournal = debounce(async () => {
  await db.journals.put({date:jDay, body:jArea.value});
  $("#jSaved").classList.add("ok");
}, 500);
function updateJLen(){ $("#jLen").textContent = [...jArea.value].length.toLocaleString(); }
$("#chips").innerHTML = CHIPS.map(c => `<button class="chip">${c}</button>`).join("");
$("#chips").addEventListener("click", e => {
  const c = e.target.closest(".chip"); if (!c) return;
  const v = jArea.value;
  const sep = !v ? "" : (v.endsWith("\n\n") ? "" : v.endsWith("\n") ? "\n" : "\n\n");
  const phrase = c.textContent.replace(/…$/, "") + " ";
  jArea.value = v + sep + phrase;
  jArea.focus();
  jArea.setSelectionRange(jArea.value.length, jArea.value.length);
  jArea.scrollTop = jArea.scrollHeight;
  updateJLen(); $("#jSaved").classList.remove("ok"); saveJournal();
});
jArea.addEventListener("input", () => { updateJLen(); $("#jSaved").classList.remove("ok"); saveJournal(); });
async function openJournal(){
  jDay = day;
  const j = await db.journals.get(jDay);
  jArea.value = j ? j.body : "";
  const [y,m,d] = jDay.split("-").map(Number);
  $("#jDate").textContent = `${m}월 ${d}일 ${DOW[new Date(y,m-1,d).getDay()]}요일`;
  $("#jSaved").classList.toggle("ok", true);
  updateJLen();
  $("#journal").classList.add("on");
  history.pushState({ui:"journal"}, "");
  setTimeout(() => { jArea.focus(); jArea.setSelectionRange(jArea.value.length, jArea.value.length); }, 120);
}
function closeJournal(fromPop){
  if (!$("#journal").classList.contains("on")) return;
  saveJournal.flush();
  jArea.blur();
  $("#journal").classList.remove("on");
  renderJCount();
  if (!fromPop && history.state && history.state.ui === "journal") history.back();
}
$("#jOpen").addEventListener("click", openJournal);
$("#jBack").addEventListener("click", () => closeJournal());
window.addEventListener("popstate", () => { closeSheet(true); closeJournal(true); });

/* ================= backup ================= */
async function exportJSON(){
  const tables = {};
  for (const t of TABLES) tables[t] = await db[t].toArray();
  const now = new Date();
  tables.meta = tables.meta.filter(m => m.key !== "lastBackup").concat([{key:"lastBackup", value:now.toISOString()}]);
  const data = {app:"oneul", schema:1, exportedAt:now.toISOString(), tables};
  const blob = new Blob([JSON.stringify(data, null, 1)], {type:"application/json"});
  const name = `oneul-backup-${keyOf(now)}.json`;
  let done = false;
  try {
    const file = new File([blob], name, {type:"application/json"});
    if (navigator.canShare && navigator.canShare({files:[file]}) && /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)){
      await navigator.share({files:[file], title:name}); done = true;
    }
  } catch(e){ if (e && e.name === "AbortError") return; }
  if (!done){
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }
  await setMeta("lastBackup", now.toISOString());
  toast("내보냈어요");
  checkBand();
}
async function importJSON(file){
  try {
    const data = JSON.parse(await file.text());
    if (!data || !data.tables || !data.tables.checkins) throw new Error("형식");
    const n = (data.tables.checkins||[]).length + (data.tables.journals||[]).length + (data.tables.dailyLogs||[]).length;
    if (!confirm(`백업(${(data.exportedAt||"").slice(0,10)})으로 지금 기기 데이터를 바꿀까요?\n기록 ${n}개. 현재 데이터는 지워져요.`)) return;
    await db.transaction("rw", TABLES.map(t => db[t]), async () => {
      for (const t of TABLES){ await db[t].clear(); if (Array.isArray(data.tables[t])) await db[t].bulkPut(data.tables[t]); }
    });
    closeSheet();
    await loadDay(); checkBand();
    toast("가져왔어요");
  } catch(e){ toast("이 파일은 읽을 수 없어요 — 오늘 앱에서 내보낸 JSON인지 확인해 주세요"); }
}
$("#importFile").addEventListener("change", e => { const f = e.target.files[0]; e.target.value = ""; if (f) importJSON(f); });

let bandHidden = false;
async function checkBand(){
  const last = await getMeta("lastBackup");
  const since = last || await getMeta("installedAt");
  const days = since ? Math.floor((Date.now() - new Date(since).getTime()) / 864e5) : 0;
  const show = !bandHidden && days >= 7;
  $("#band").classList.toggle("show", show);
  if (show) $("#bandText").textContent = last ? `백업한 지 ${days}일 됐어요` : "아직 백업한 적이 없어요";
}
$("#bandExport").addEventListener("click", exportJSON);
$("#bandX").addEventListener("click", () => { bandHidden = true; checkBand(); });

async function openSettings(){
  const last = await getMeta("lastBackup");
  const lastTxt = last ? (() => { const d = new Date(last); return `${d.getMonth()+1}월 ${d.getDate()}일`; })() : "아직 없음";
  const cnt = await db.checkins.count(), jc = await db.journals.count();
  openSheet(`<h3>설정</h3><p class="sub">모든 기록은 이 기기 안에만 있어요.</p>
    <div style="margin-top:8px">
      <div class="setrow"><div><div class="k">JSON 내보내기</div><div class="v">마지막 백업 ${lastTxt}</div></div><button class="pill acc" id="sExport">내보내기</button></div>
      <div class="setrow"><div><div class="k">JSON 가져오기</div><div class="v">현재 데이터를 백업으로 바꿔요</div></div><button class="pill" id="sImport">가져오기</button></div>
      <div class="setrow"><div><div class="k">저장소 보호</div><div class="v">${persisted === true ? "켜짐 — 브라우저가 임의로 지우지 않아요" : persisted === false ? "꺼짐 — 홈 화면에 추가하면 켜지기 쉬워요" : "확인 불가"}</div></div></div>
    </div>
    <p class="fine num">점수 ${cnt}개 · 주저리 ${jc}일치 저장됨<br>브라우저 데이터를 지우면 기록도 사라져요. 일주일에 한 번 내보내 두세요.</p>`,
    el => {
      el.querySelector("#sExport").onclick = exportJSON;
      el.querySelector("#sImport").onclick = () => $("#importFile").click();
    });
}
$("#gear").addEventListener("click", openSettings);

/* ================= misc ================= */
let toastT;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2200); }

// 날짜 바뀌면 자동으로 새 날
async function checkRollover(){
  if (todayKey() !== day){
    saveLog.flush();
    closeSheet();
    await loadDay();
    checkBand();
  }
}
setInterval(checkRollover, 30000);
document.addEventListener("visibilitychange", () => {
  if (document.hidden){ saveLog.flush(); if ($("#journal").classList.contains("on")) saveJournal.flush(); }
  else checkRollover();
});
window.addEventListener("pagehide", () => { saveLog.flush(); });

/* ================= boot ================= */
(async function boot(){
  try { if (navigator.storage && navigator.storage.persist) persisted = await navigator.storage.persist(); } catch(e){}
  if (!(await getMeta("installedAt"))) await setMeta("installedAt", new Date().toISOString());
  await loadDay();
  checkBand();
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")){
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
})();
</script>
